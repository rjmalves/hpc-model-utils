[project]
name = "hpc-model-utils"
version = "1.0.0"
description = "CLI tool for running energy planning models (NEWAVE, DECOMP, DESSEM) in HPC clusters with SLURM and AWS S3 integration"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
  { name = "Mariana Noel", email = "marianasimoesnoel@gmail.com" },
  { name = "Rogerio Alves", email = "rogerioalves.ee@gmail.com" },
]
keywords = ["hpc", "newave", "decomp", "dessem", "slurm", "s3", "cli", "energy-models"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "boto3>=1.35",
  "click>=8.1",
  "idecomp>=1.7",
  "idessem>=0.0.23",
  "inewave>=1.10",
  "pytz",
]

[project.optional-dependencies]
dev = [
  "boto3-stubs[s3]>=1.35",
  "mypy",
  "pytest",
  "pytest-cov>=6.0",
  "pytest-timeout>=2.2",
  "requests>=2.31",
  "ruff>=0.9",
]

[project.urls]
Homepage = "https://github.com/rjmalves/hpc-model-utils"
Repository = "https://github.com/rjmalves/hpc-model-utils"
Issues = "https://github.com/rjmalves/hpc-model-utils/issues"

[project.scripts]
hpc-model-utils = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
  "main.py",
  "app/",
]

[dependency-groups]
dev = [
  "boto3-stubs[s3]>=1.35",
  "mypy",
  "pytest",
  "pytest-cov>=6.0",
  "pytest-timeout>=2.2",
  "requests>=2.31",
  "ruff>=0.9",
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.adapter.repository.*"
disable_error_code = ["arg-type", "union-attr", "override", "no-any-return"]

[[tool.mypy.overrides]]
module = "app.utils.s3_client"
disable_error_code = ["no-any-return"]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
markers = [
  "integration: Integration tests requiring LocalStack (deselect with '-m \"not integration\"')",
  "slow: Slow tests that may take longer to run",
]
timeout = 300
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "--strict-markers",
  "--tb=short",
]
