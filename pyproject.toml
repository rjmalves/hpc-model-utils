[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hpc-model-utils"
dynamic = ["version"]
dependencies = [
  "boto3>=1.35.98",
  "botocore>=1.35.98",
  "click>=8.1.8",
  "idecomp>=1.7.0",
  "idessem>=0.0.23",
  "inewave>=1.10.0",
]
requires-python = ">= 3.10"
authors = [
  {name = "Mariana Noel", email = "marianasimoesnoel@gmail.com"},
  {name = "Rogerio Alves", email = "rogerioalves.ee@gmail.com"},
]
description = "hpc-model-utils"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-cov>=6.0.0",
  "pytest-timeout>=2.2.0",
  "requests>=2.31.0",
  "boto3-stubs[essential]"
]

[project.urls]
Repository = "https://github.com/marianasnoel/hpc-model-utils/"

[project.scripts]
hpc-model-utils = "main:main"

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
include = [
  "main.py",
  "app/",
]

[tool.ruff]
line-length = 80

[tool.pytest.ini_options]
markers = [
    "integration: Integration tests requiring LocalStack (deselect with '-m \"not integration\"')",
    "slow: Slow tests that may take longer to run",
]
timeout = 300
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.42.4",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.4.0",
    "requests>=2.32.5",
]
